name: Update game shelf

on:
  schedule:
    - cron: "17 10 * * *"   # daily, about 5:17 AM in Dallas (10:17 UTC)
  workflow_dispatch:         # "Run workflow" button for a manual refresh
  push:
    branches: [main]
    paths: ["config/**", "site/index.html"]   # editing your Nintendo list or overrides triggers a run

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: shelf
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Fetch libraries and scores
        env:
          STEAM_API_KEY: ${{ secrets.STEAM_API_KEY }}
          STEAM_ID: ${{ secrets.STEAM_ID }}
          PSN_NPSSO: ${{ secrets.PSN_NPSSO }}
          IGDB_CLIENT_ID: ${{ secrets.IGDB_CLIENT_ID }}
          IGDB_CLIENT_SECRET: ${{ secrets.IGDB_CLIENT_SECRET }}
          OPENCRITIC_RAPIDAPI_KEY: ${{ secrets.OPENCRITIC_RAPIDAPI_KEY }}
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
        run: python -m pipeline.build

      - name: Save cache and data
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # These files are generated, so this run's copy always wins; everything else comes from GitHub.
          mkdir -p /tmp/out && cp -r cache /tmp/out/ && cp site/data.json /tmp/out/ 2>/dev/null || true
          for attempt in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main
            cp -r /tmp/out/cache . && cp /tmp/out/data.json site/ 2>/dev/null || true
            git add cache site/data.json
            git diff --cached --quiet && break
            git commit -m "Daily update [skip ci]"
            git push origin HEAD:main && break
            sleep 5
          done

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4
