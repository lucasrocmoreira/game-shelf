name: Debug Switch Online list
on: workflow_dispatch
permissions:
  contents: write
jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install -q -r requirements.txt
      - run: |
          mkdir -p debug
          python - <<'PY'
          import json, requests
          from pipeline import nso
          for name, url, params in [
              ("parse", nso.API, {"action": "parse", "page": nso.PAGE, "prop": "text", "format": "json", "formatversion": 2, "redirects": 1}),
              ("rest", f"https://en.wikipedia.org/api/rest_v1/page/html/{nso.PAGE}", None)]:
              try:
                  r = requests.get(url, params=params, headers=nso.HEADERS, timeout=60)
                  open(f"debug/{name}.txt", "w").write(f"{r.status_code}\n{dict(r.headers)}\n\n{r.text}")
              except Exception as e:
                  open(f"debug/{name}.txt", "w").write(repr(e))
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b debug-nso
          git add -f debug
          git commit -qm "debug output"
          git push -f origin debug-nso
