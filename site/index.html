<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Game Shelf</title>
<meta name="theme-color" content="#E7E9EE" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#151821" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wdth,wght@12..96,75..100,400..800&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#E7E9EE; --panel:#F6F7F9; --ink:#1B2130; --muted:#5D6578; --line:#CDD2DC;
  --accent:#3550E6; --accent-ink:#fff;
  --hi:#1F8A5B; --mid:#B88A12; --lo:#C0453B; --none:#9AA1B0;
  --display:"Bricolage Grotesque",system-ui,sans-serif; --body:"IBM Plex Sans",system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#151821; --panel:#1E2230; --ink:#E9ECF3; --muted:#9AA2B6; --line:#2E3447;
  --accent:#7D92FF; --accent-ink:#0F1220; --hi:#3CC487; --mid:#E0B341; --lo:#F07467; --none:#5D6578;
}}
*{box-sizing:border-box}
[hidden]{display:none !important}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:400 15px/1.5 var(--body)}
a{color:inherit}
button,select,input{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:860px;margin:0 auto;padding:20px 16px 64px}

.topbar{display:flex;justify-content:flex-end;gap:8px;margin-bottom:4px}
.iconbtn{border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:6px 12px;cursor:pointer;font-size:14px}
.iconbtn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:600}

/* View switch: your library or the PS Plus catalog */
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin:4px 0 16px;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tabs button{all:unset;cursor:pointer;padding:8px 12px;white-space:nowrap;font:650 16px/1.2 var(--display);color:var(--muted);border-bottom:3px solid transparent;margin-bottom:-1px}
.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
.tabs button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
label.inline{display:inline-flex;gap:6px;align-items:center;font-size:14px}
.pill.new{border-color:var(--accent);color:var(--accent)}
body.view-psplus .lib-only{display:none}

/* Playing now: the games you're in the middle of */
.now{margin:6px 0 22px}
.now h2{font:750 20px/1.1 var(--display);font-stretch:85%;margin:0 0 10px}
.now-row{display:grid;grid-auto-flow:column;grid-auto-columns:min(calc((100% - 20px) / 3), 210px);gap:10px;overflow-x:auto;scroll-snap-type:x mandatory;padding-bottom:4px}
.now-card{all:unset;cursor:pointer;scroll-snap-align:start;display:grid;gap:4px;align-content:start;min-width:0}
.now-card:focus-visible{outline:2px solid var(--accent);outline-offset:3px;border-radius:8px}
.now-card img{width:100%;aspect-ratio:264/374;object-fit:cover;border-radius:8px;background:var(--line);box-shadow:0 8px 20px -12px rgba(20,25,45,.6)}
.now-t{font:650 14px/1.2 var(--display);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.now-p{font-size:12px;color:var(--muted)}
.bar{height:4px;border-radius:2px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;background:var(--hi)}
.now-empty{font-size:13px;color:var(--muted);margin:0}
.now-head{display:flex;justify-content:space-between;align-items:center;gap:10px;margin:0 0 10px}
.now-head h2{margin:0}
.picks{display:grid;gap:10px}
.pick{all:unset;cursor:pointer;display:grid;grid-template-columns:64px minmax(0,1fr) auto;gap:12px;align-items:start;padding:10px;border:1px solid var(--line);border-radius:12px;background:var(--bg)}
.pick:focus-visible{outline:2px solid var(--accent)}
.pick img{width:64px;aspect-ratio:264/374;object-fit:cover;border-radius:6px;background:var(--line)}
.pick b{font:650 16px/1.2 var(--display);display:block}
.pick ul{margin:4px 0 0;padding-left:16px;font-size:13px;color:var(--muted)}
.pick .score{font-size:24px;min-width:0}
.sheet-game{display:block;border:0;padding:0}
.sheet-game .detail{padding-top:0}

/* Hero: the current number one */
.hero{display:grid;grid-template-columns:132px 1fr;gap:18px;align-items:end;margin:8px 0 26px}
.hero img{width:132px;aspect-ratio:3/4;object-fit:cover;border-radius:10px;background:var(--line);box-shadow:0 10px 30px -12px rgba(20,25,45,.55)}
.hero .lead{color:var(--muted);margin:0 0 4px;font-size:14px}
.hero h1{font:800 clamp(30px,7vw,52px)/.95 var(--display);font-stretch:78%;letter-spacing:-.01em;margin:0 0 10px}
.hero .big{font:800 clamp(56px,14vw,96px)/.8 var(--display);font-stretch:75%;display:block}
.hero .meta{color:var(--muted);font-size:14px;margin-top:8px}

.status{background:var(--panel);border:1px solid var(--line);border-left:4px solid var(--mid);border-radius:8px;padding:10px 12px;margin:0 0 18px;font-size:14px}
.status p{margin:2px 0}

/* Controls */
.controls{background:var(--bg);padding:10px 16px 12px;margin:0 -16px 6px;border-bottom:1px solid var(--line)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.row+.row,.row+details,details+.row{margin-top:8px}
.search{flex:1 1 180px;min-width:0;padding:9px 12px;border:1px solid var(--line);border-radius:999px;background:var(--panel)}
select{padding:8px 10px;border:1px solid var(--line);border-radius:999px;background:var(--panel);max-width:100%}
.chip{border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:6px 12px;cursor:pointer;font-size:14px}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:999px;overflow:hidden}
.seg button{border:0;background:var(--panel);padding:6px 12px;font-size:14px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.count{color:var(--muted);font-size:13px;margin-left:auto}
details.opts{font-size:14px;color:var(--muted)}
details.opts summary{cursor:pointer}
details.opts .grid{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
details.opts label{display:inline-flex;gap:6px;align-items:center;margin:6px 12px 0 0;color:var(--ink)}
.active{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.active:empty{display:none}
.tagchip{border:1px solid var(--accent);color:var(--accent);background:transparent;border-radius:999px;padding:2px 10px;font-size:13px;cursor:pointer}

/* List */
ol.list{list-style:none;margin:0;padding:0}
.game{display:grid;grid-template-columns:34px 48px minmax(0,1fr) auto;gap:4px 12px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}
.game.is-hidden{opacity:.55}
.rank{font:700 18px/1 var(--display);color:var(--muted);text-align:right;font-variant-numeric:tabular-nums}
.game img.cover{width:48px;aspect-ratio:3/4;object-fit:cover;border-radius:5px;background:var(--line)}
.title-btn{all:unset;cursor:pointer;min-width:0;display:block}
.game .t{font:650 17px/1.2 var(--display);margin:0;overflow-wrap:anywhere}
.game .sub{color:var(--muted);font-size:13px;margin-top:3px}
.pill{display:inline-block;font-size:12px;border:1px solid var(--line);border-radius:4px;padding:0 5px;margin-right:4px;color:var(--ink)}
.pill.played{border-color:var(--hi);color:var(--hi)}
.pill.warn{border-color:var(--mid);color:var(--mid)}
.score{font:800 28px/1 var(--display);font-stretch:80%;text-align:right;min-width:52px;font-variant-numeric:tabular-nums}
.hi{color:var(--hi)} .mid{color:var(--mid)} .lo{color:var(--lo)} .na{color:var(--none)}

.detail{grid-column:3/5;padding-top:8px;display:grid;gap:10px;min-width:0}
.detail > *{min-width:0}
.actions{display:flex;flex-wrap:wrap;gap:8px}
.actions button{border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:6px 12px;font-size:14px;cursor:pointer}
.actions button.on{background:var(--hi);border-color:var(--hi);color:#fff}
.breakdown{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(130px,100%),1fr));gap:6px 14px;font-size:13px}
.breakdown div{display:flex;justify-content:space-between;border-bottom:1px dotted var(--line);padding:2px 0}
.breakdown b{font-variant-numeric:tabular-nums}
.summary{font-size:14px;color:var(--ink);margin:0;max-width:68ch}
.facts{font-size:13px;color:var(--muted);display:grid;gap:4px}
.facts .tags{display:flex;flex-wrap:wrap;gap:4px;align-items:center}
.facts .tags span.k{min-width:86px;color:var(--muted)}
.tag{border:1px solid var(--line);background:transparent;border-radius:999px;padding:0 8px;font-size:12px;cursor:pointer;color:var(--ink)}
.links{font-size:13px;color:var(--muted)}
.links a{margin-right:12px}
.note{font-size:13px;color:var(--mid)}

section.group{margin-top:26px}
section.group h2{font:750 24px/1.1 var(--display);font-stretch:85%;margin:0 0 4px;display:flex;justify-content:space-between;align-items:baseline;gap:12px}
section.group h2 small{font:400 13px var(--body);color:var(--muted)}
.more{margin-top:10px;background:none;border:0;color:var(--accent);cursor:pointer;padding:4px 0;font-weight:600}

.empty{padding:40px 0;color:var(--muted);text-align:center}
footer{margin-top:32px;color:var(--muted);font-size:13px}

/* Sheets (settings, add game, fix match) */
dialog{border:0;padding:0;background:transparent;max-width:min(560px,100vw);width:100%;margin:auto auto 0}
dialog::backdrop{background:rgba(10,12,20,.45)}
.sheet{background:var(--panel);color:var(--ink);border-radius:16px 16px 0 0;padding:20px 16px calc(20px + env(safe-area-inset-bottom));display:grid;gap:12px}
@media (min-width:600px){dialog{margin:auto}.sheet{border-radius:16px}}
.sheet h2{font:750 24px/1.1 var(--display);font-stretch:85%;margin:0}
.sheet p{margin:0;font-size:14px;color:var(--muted)}
.sheet label{display:grid;gap:4px;font-size:14px}
.sheet input,.sheet select{padding:9px 12px;border:1px solid var(--line);border-radius:10px;background:var(--bg);width:100%}
.sheet .btns{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
.sheet ol{margin:0;padding-left:20px;font-size:14px;color:var(--muted)}
.suggest{display:grid;gap:4px;max-height:240px;overflow:auto;margin-top:-4px}
.suggest:empty{display:none}
.suggest button{all:unset;cursor:pointer;padding:8px 10px;border:1px solid var(--line);border-radius:10px;background:var(--bg);font-size:14px}
.suggest button:focus-visible{outline:2px solid var(--accent)}
.suggest small{display:block;color:var(--muted);font-size:12px}
.picked{font-size:13px;color:var(--hi)}
.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:999px;font-size:14px;z-index:50;max-width:calc(100vw - 32px)}
.toast[hidden]{display:none}

@media (min-width:700px){.controls{position:sticky;top:0;z-index:5}}
@media (max-width:520px){
  .hero{grid-template-columns:96px 1fr;gap:14px}
  .hero img{width:96px}
  .game{grid-template-columns:26px 40px minmax(0,1fr) auto;gap:4px 10px}
  .game img.cover{width:40px}
  .detail{grid-column:1/5}
}
@media (prefers-reduced-motion:no-preference){
  .hero img{animation:lift .6s cubic-bezier(.2,.8,.2,1) both}
  @keyframes lift{from{opacity:0;transform:translateY(14px) rotate(-2deg)}to{opacity:1;transform:none}}
}
</style>
</head>
<body>
<main class="wrap">
  <div class="topbar">
    <button class="iconbtn" id="addBtn">Add a game</button>
    <button class="iconbtn" id="settingsBtn" aria-label="Settings">Settings</button>
  </div>
  <nav class="tabs" id="tabs" role="tablist" aria-label="View">
    <button type="button" role="tab" data-view="library" aria-selected="true">My library</button>
    <button type="button" role="tab" data-view="psplus" aria-selected="false">PS Plus</button>
    <button type="button" role="tab" data-view="ps5" aria-selected="false">PS5</button>
    <button type="button" role="tab" data-view="switch2" aria-selected="false">Switch 2</button>
    <button type="button" role="tab" data-view="ds" aria-selected="false">DS</button>
    <button type="button" role="tab" data-view="3ds" aria-selected="false">3DS</button>
    <button type="button" role="tab" data-view="steam" aria-selected="false">Steam Machine</button>
  </nav>
  <section class="now" id="now" aria-label="Playing now"></section>
  <header class="hero" id="hero" aria-live="polite"></header>
  <div id="status"></div>

  <div class="controls">
    <div class="row">
      <input class="search" id="q" type="search" placeholder="Search titles, series, studios, keywords" aria-label="Search">
      <select id="sort" aria-label="Rank by"></select>
    </div>
    <div class="row" id="platforms" role="group" aria-label="Platforms"></div>
    <div class="row" id="catRow" hidden>
      <div class="seg" id="tierSeg" role="group" aria-label="Catalog">
        <button data-v="all" aria-pressed="true">Everything</button>
        <button data-v="Game Catalog" aria-pressed="false">Game Catalog</button>
        <button data-v="Classics" aria-pressed="false">Classics</button>
      </div>
      <label class="inline"><input type="checkbox" id="hideOwned"> Hide games I own</label>
    </div>
    <div class="row">
      <div class="seg" id="playedSeg" role="group" aria-label="Played status">
        <button data-v="all" aria-pressed="true">All</button>
        <button data-v="played" aria-pressed="false">Played</button>
        <button data-v="unplayed" aria-pressed="false">Not played</button>
      </div>
      <select id="group" aria-label="Group by"></select>
      <span class="count" id="count"></span>
    </div>
    <details class="opts" id="filtersBox">
      <summary>Filter by genre, theme, franchise, mode, length</summary>
      <div class="grid">
        <select id="f_genres" aria-label="Genre"></select>
        <select id="f_themes" aria-label="Theme"></select>
        <select id="f_franchises" aria-label="Franchise"></select>
        <select id="f_modes" aria-label="Mode"></select>
        <select id="f_perspectives" aria-label="Perspective"></select>
        <select id="f_length" aria-label="Length"></select>
      </div>
    </details>
    <details class="opts">
      <summary>Scores in the average and other options</summary>
      <div id="srcBoxes"></div>
      <label><input type="checkbox" id="hideUnscored"> Hide games with no score</label>
      <label class="lib-only"><input type="checkbox" id="hidePlus"> Hide unplayed PS Plus claims</label>
      <label class="lib-only"><input type="checkbox" id="hideNso"> Hide unplayed Switch Online classics</label>
      <label><input type="checkbox" id="showHidden"> Show hidden games and apps</label>
    </details>
    <div class="active" id="active"></div>
  </div>

  <div id="out"></div>
  <footer id="foot"></footer>
</main>

<dialog id="dlg"><form method="dialog" class="sheet" id="sheet"></form></dialog>
<div class="toast" id="toast" role="status" hidden></div>

<script>
const SOURCES = {
  metacritic:  {label:"Metacritic"},
  opencritic:  {label:"OpenCritic"},
  backloggd:   {label:"Backloggd"},
  igdb_critic: {label:"IGDB critics"},
  igdb_user:   {label:"IGDB players"},
  steam:       {label:"Steam reviews"},
};
const SORTS = [
  ["avg","Average score"], ...Object.entries(SOURCES).map(([k,v])=>[k,v.label]),
  ["added","Newest in catalog"], ["ttb_short","Shortest to beat"], ["ttb_long","Longest to beat"], ["playtime","Most played"], ["recent","Recently played"], ["year","Newest release"], ["title","Title A to Z"],
];
const GROUPS = [["","No grouping"],["genres","Group by genre"],["themes","Group by theme"],["franchises","Group by franchise"],
  ["platforms","Group by platform"],["developers","Group by developer"],["modes","Group by mode"]];
const FILTERS = {genres:"All genres", themes:"All themes", franchises:"All franchises", modes:"All modes", perspectives:"All perspectives"};
const LINK_LABELS = {metacritic:"Metacritic",opencritic:"OpenCritic",backloggd:"Backloggd",igdb:"IGDB",steam:"Steam",hltb:"HowLongToBeat"};
const LENGTHS = [["","Any length"],["0-10","Under 10 hours"],["10-30","10 to 30 hours"],["30-60","30 to 60 hours"],["60-9999","Over 60 hours"]];
const beat = g => g.ttb ? (g.ttb.main ?? g.ttb.extra ?? g.ttb.complete ?? null) : null;  // hours for the main story
const hrs = h => h==null ? "–" : (h<1 ? "<1h" : (Number.isInteger(h) ? h : h.toFixed(1)) + "h");
const PLATFORM_CHOICES = ["Switch","Switch 2","PS5","PS4","Steam","3DS","DS","GBA","Game Boy","Wii U","Wii","GameCube","PS Vita","PSP","PS3","Xbox","Other"];
const EMPTY_EDITS = () => ({hidden:{}, unhidden:{}, played:{}, playing:{}, added:[], match:{}});

const store = {
  get(k, d){ try{ const v = localStorage.getItem(k); return v==null ? d : JSON.parse(v); }catch{ return d; } },
  set(k, v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch{} },
  del(k){ try{ localStorage.removeItem(k); }catch{} },
};
const prefs = store.get("shelf-prefs", {});
const state = {
  q:"", sort:prefs.sort||"avg", group:prefs.group||"", platforms:new Set(), played:prefs.played||"all",
  filters:{}, tags:[], length:"", view:prefs.view||"library", tier:"all", hideOwned:!!prefs.hideOwned, hideUnscored:!!prefs.hideUnscored, hidePlus:!!prefs.hidePlus, hideNso:!!prefs.hideNso, showHidden:false,
  srcOn:new Set(prefs.srcOn||Object.keys(SOURCES)), open:new Set(),
};
function savePrefs(){ store.set("shelf-prefs",{sort:state.sort,group:state.group,played:state.played,hideUnscored:state.hideUnscored,hidePlus:state.hidePlus,hideNso:state.hideNso,hideOwned:state.hideOwned,view:state.view,srcOn:[...state.srcOn]}); }

// Which repository this site belongs to: <owner>.github.io/<repo>/
const REPO = store.get("shelf-repo", null) || (()=>{
  const owner = location.hostname.endsWith(".github.io") ? location.hostname.split(".")[0] : "";
  const repo = location.pathname.split("/").filter(Boolean)[0] || "";
  return owner && repo ? {owner, repo} : null;
})();
const EDITS_PATH = "config/library_edits.json";

let DATA = {games:[]};
let EDITS = EMPTY_EDITS();
let liveEdits = false;
const $ = id => document.getElementById(id);
const esc = s => String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const tone = v => v==null?"na":v>=80?"hi":v>=65?"mid":"lo";
const today = () => new Date().toLocaleDateString("en-CA");  // local date, YYYY-MM-DD

/* ---------------- GitHub storage for your edits ---------------- */
const token = () => store.get("shelf-gh-token", "");
function b64encode(str){ return btoa(unescape(encodeURIComponent(str))); }
function b64decode(b64){ return decodeURIComponent(escape(atob(b64.replace(/\s/g,"")))); }
async function gh(path, opts={}){
  const headers = {"Accept":"application/vnd.github+json", ...(opts.headers||{})};
  if(token()) headers.Authorization = "Bearer " + token();
  return fetch(`https://api.github.com/repos/${REPO.owner}/${REPO.repo}/${path}`, {...opts, headers, cache:"no-store"});
}
async function readEdits(){
  if(!REPO) return null;
  const r = await gh(`contents/${EDITS_PATH}`);
  if(r.status === 404) return {data:EMPTY_EDITS(), sha:null};
  if(!r.ok) throw new Error(`GitHub said ${r.status}`);
  const j = await r.json();
  return {data:{...EMPTY_EDITS(), ...JSON.parse(b64decode(j.content))}, sha:j.sha};
}
async function writeEdits(mutate, message, rebuild){
  if(!REPO) throw new Error("Can't tell which GitHub repository this site belongs to.");
  if(!token()) { openSettings("Connect GitHub to save changes. It takes about two minutes, once per device."); throw new Error("not-connected"); }
  for(let attempt=0; attempt<3; attempt++){
    const cur = await readEdits();
    const data = cur.data; mutate(data);
    const body = {message: message + (rebuild ? "" : " [skip ci]"), content: b64encode(JSON.stringify(data, null, 1) + "\n")};
    if(cur.sha) body.sha = cur.sha;
    const r = await gh(`contents/${EDITS_PATH}`, {method:"PUT", body:JSON.stringify(body), headers:{"Content-Type":"application/json"}});
    if(r.ok){ EDITS = data; liveEdits = true; return; }
    if(r.status === 409 || r.status === 422) continue;  // someone else saved first; retry on top of it
    if(r.status === 401) throw new Error("GitHub rejected the token. Create a new one in Settings.");
    if(r.status === 403 || r.status === 404) throw new Error("The token can't write to this repository. Check it has Contents: Read and write.");
    throw new Error(`GitHub said ${r.status}`);
  }
  throw new Error("Couldn't save after several tries. Try again.");
}
async function act(mutate, message, okText, rebuild=false){
  try{
    await writeEdits(mutate, message, rebuild);
    applyAll(); render(); toast(okText);
  }catch(e){ if(e.message !== "not-connected") toast(e.message); }
}

/* ---------------- Edits overlay ---------------- */
function keysOf(g){ return [g.key, ...(g.src||[]).map(s=>"t:"+s), ...(g.pending_key?[g.pending_key]:[])]; }
function applyAll(){ const keep = DATA; for(const v of ["library","psplus"]) if(VIEWS[v].data){ DATA = VIEWS[v].data; applyEdits(); } DATA = keep; }
function applyEdits(){
  for(const g of DATA.games){
    if(!liveEdits){ g._hidden = g.hidden; g._played = g.played; g._playing = g.playing; continue; }
    const ks = keysOf(g);
    if(ks.some(k=>k in EDITS.unhidden)) g._hidden = null;
    else if(ks.some(k=>k in EDITS.hidden)) g._hidden = "you";
    else g._hidden = g.hidden === "auto" ? "auto" : null;
    const p = ks.find(k=>k in EDITS.played);
    g._played = p ? EDITS.played[p] : null;
    const n = ks.find(k=>k in (EDITS.playing||{}));
    g._playing = n ? EDITS.playing[n] : null;
  }
}
function togglePlayed(g){
  const on = !g._played, wasPlaying = !!g._playing;
  act(d=>{ d.playing = d.playing||{};
           for(const k of keysOf(g)){ delete d.played[k]; if(on) delete d.playing[k]; }
           if(on) d.played[g.key] = today(); },
      `${on?"Played":"Not played"}: ${g.title}`,
      on ? (wasPlaying ? `Finished ${g.title}: marked as played and taken off Playing now` : `Marked ${g.title} as played`) : `Unmarked ${g.title}`);
}
function togglePlaying(g){
  const on = !g._playing;
  act(d=>{ d.playing = d.playing||{}; for(const k of keysOf(g)) delete d.playing[k]; if(on) d.playing[g.key] = today(); },
      `${on?"Playing":"Stopped playing"}: ${g.title}`, on ? `${g.title} pinned to Playing now` : `${g.title} taken off Playing now`);
}
function toggleHidden(g){
  const hide = !g._hidden;
  act(d=>{
    for(const k of keysOf(g)){ delete d.hidden[k]; delete d.unhidden[k]; }
    if(hide) d.hidden[g.key] = g.title; else if(g.hidden === "auto") d.unhidden[g.key] = g.title;
  }, `${hide?"Hide":"Unhide"}: ${g.title}`, hide ? `Hid ${g.title}` : `${g.title} is back on your shelf`);
}

/* ---------------- Scores, sorting, filtering ---------------- */
function avg(g){
  const vals = [...state.srcOn].map(k=>g.scores[k]).filter(v=>typeof v==="number");
  return vals.length ? Math.round(vals.reduce((a,b)=>a+b,0)/vals.length) : null;
}
function value(g,key){
  if(key==="avg") return avg(g);
  if(key in SOURCES) return g.scores[key];
  if(key==="playtime") return g.playtime||null;
  if(key==="recent") return g.last_played?Date.parse(g.last_played):null;
  if(key==="year") return g.year;
  if(key==="ttb_short"||key==="ttb_long") return beat(g);
  if(key==="added") return g.added ? Date.parse(g.added) : null;
  return null;
}
function sorted(list){
  const k = state.sort;
  if(k==="title") return [...list].sort((a,b)=>a.title.localeCompare(b.title));
  return [...list].sort((a,b)=>{
    const va=value(a,k), vb=value(b,k);
    if(va==null&&vb==null) return a.title.localeCompare(b.title);
    if(va==null) return 1; if(vb==null) return -1;
    if(k==="ttb_short") return va-vb || (avg(b)??-1)-(avg(a)??-1) || a.title.localeCompare(b.title);
    return vb-va || (avg(b)??-1)-(avg(a)??-1) || a.title.localeCompare(b.title);
  });
}
function haystack(g){
  if(!g._hay) g._hay = [g.title, ...(g.franchises||[]), ...(g.series||[]), ...(g.developers||[]), ...(g.publishers||[]),
    ...(g.keywords||[]), ...(g.themes||[]), ...(g.genres||[])].join(" | ").toLowerCase();
  return g._hay;
}
function filtered(){
  const q = state.q.trim().toLowerCase();
  return DATA.games.filter(g=>
    (state.showHidden || !g._hidden) &&
    (!q || haystack(g).includes(q)) &&
    (!state.platforms.size || g.platforms.some(p=>state.platforms.has(p))) &&
    Object.entries(state.filters).every(([f,v])=>!v || (g[f]||[]).includes(v)) &&
    state.tags.every(t=>(g[t.field]||[]).includes(t.value)) &&
    (state.view!=="psplus" || ((state.tier==="all" || (g.tiers||[]).includes(state.tier)) && (!state.hideOwned || !g.owned))) &&
    (state.played==="all" || (state.played==="played" ? !!g._played : !g._played)) &&
    (!state.hideUnscored || avg(g)!=null) &&
    (!state.length || (()=>{ const h=beat(g), [lo,hi]=state.length.split("-").map(Number); return h!=null && h>=lo && h<hi; })()) &&
    (!state.hidePlus || !g.ps_plus || g.playtime>0 || g._played) &&
    (!state.hideNso || !g.nso || g._played || g._playing));
}
function shown(g){
  const k=state.sort;
  if(k==="playtime") return {v:g.playtime?Math.round(g.playtime):null, unit:"h", cls:""};
  if(k==="year") return {v:g.year, unit:"", cls:""};
  if(k==="ttb_short"||k==="ttb_long"){ const h=beat(g); return {v:h==null?null:(h<1?"<1":Math.round(h)), unit:"h", cls:""}; }
  if(k==="recent"||k==="title"||k==="added") { const a=avg(g); return {v:a,unit:"",cls:tone(a)}; }
  const v=value(g,k); return {v, unit:"", cls:tone(v)};
}

/* ---------------- Rendering ---------------- */
function tagList(label, field, items){
  if(!items || !items.length) return "";
  return `<div class="tags"><span class="k">${label}</span>${items.map(v=>`<button type="button" class="tag" data-field="${field}" data-value="${esc(v)}">${esc(v)}</button>`).join("")}</div>`;
}
function detail(g){
  const breakdown = Object.entries(SOURCES).map(([k,v])=>{
    const val=g.scores[k];
    let extra = "";
    if(k==="backloggd" && g.backloggd_stars!=null) extra = ` <span class="na">(${g.backloggd_stars}★)</span>`;
    if(k==="opencritic" && g.opencritic_tier) extra = ` <span class="na">(${esc(g.opencritic_tier)})</span>`;
    return `<div><span>${v.label}</span><b class="${tone(val)}">${val??"–"}${extra}</b></div>`;
  }).join("") + (g.playtime?`<div><span>Played</span><b>${g.playtime} h</b></div>`:"");
  const links = Object.entries(g.links||{}).map(([k,u])=>`<a href="${esc(u)}" target="_blank" rel="noopener">${LINK_LABELS[k]||k}</a>`).join("");
  const people = [g.developers?.length ? `Developed by ${g.developers.map(esc).join(", ")}` : "",
                  g.publishers?.length && g.publishers.join()!==(g.developers||[]).join() ? `published by ${g.publishers.map(esc).join(", ")}` : ""].filter(Boolean).join(", ");
  let note = "";
  if(!g.matched) note = `<p class="note">Not found on IGDB, so genres and some scores are missing. Use “Wrong match?” to link it.</p>`;
  else if(g.match==="medium") note = `<p class="note">This match was a close call. If it's the wrong game, use “Wrong match?”.</p>`;
  return `<div class="detail">
    <div class="actions">
      <button type="button" data-act="playing" class="${g._playing?"on":""}">${g._playing?"Playing now ✓":"Playing now"}</button>
      <button type="button" data-act="played" class="${g._played?"on":""}">${g._played?"Played ✓":"Mark as played"}</button>
      <button type="button" data-act="hide">${g._hidden?"Unhide":"Hide"}</button>
      <button type="button" data-act="fix">Wrong match?</button>
    </div>
    ${note}
    ${g.summary?`<p class="summary">${esc(g.summary)}</p>`:""}
    <div class="breakdown">${breakdown}</div>
    ${g.ttb?`<div class="facts"><div><b>Time to beat</b> <span class="na">(${esc(g.ttb.src)})</span></div>
      <div class="breakdown"><div><span>Main story</span><b>${hrs(g.ttb.main)}</b></div><div><span>Main + extras</span><b>${hrs(g.ttb.extra)}</b></div><div><span>Completionist</span><b>${hrs(g.ttb.complete)}</b></div></div></div>`:""}
    <div class="facts">
      ${people?`<div>${people}</div>`:""}
      ${tagList("Franchise","franchises",g.franchises)}
      ${tagList("Series","series",g.series)}
      ${tagList("Themes","themes",g.themes)}
      ${tagList("Modes","modes",g.modes)}
      ${tagList("Perspective","perspectives",g.perspectives)}
      ${tagList("Keywords","keywords",g.keywords)}
    </div>
    ${links?`<div class="links">${links}</div>`:""}
  </div>`;
}
function gameRow(g,i){
  const s = shown(g);
  const open = state.open.has(g.key);
  const pills = g.platforms.map(p=>`<span class="pill">${esc(p)}</span>`).join("")
    + (g.ps_plus?`<span class="pill">PS Plus</span>`:"")
    + (g.nso?`<span class="pill">Switch Online</span>`:"")
    + ((g.tiers||[]).length && !(g.tiers||[]).includes("Game Catalog") ? `<span class="pill">Classics</span>` : "")
    + (state.view==="psplus" && g.owned ? `<span class="pill played">In your library</span>` : "")
    + (CONSOLES[state.view] && g._catalog ? `<span class="pill">PS Plus catalog</span>` : "")
    + (g.added && (Date.now()-Date.parse(g.added)) < 30*864e5 ? `<span class="pill new">New</span>` : "")
    + (g._played?`<span class="pill played">Played</span>`:"")
    + (g._hidden?`<span class="pill">${g._hidden==="auto"?"App, hidden":"Hidden"}</span>`:"")
    + (!g.matched?`<span class="pill warn">Not on IGDB</span>`:"");
  const subs = [pills, esc((g.genres||[]).slice(0,2).join(", ")), g.year||"", beat(g)!=null?`· ${hrs(beat(g))} to beat`:""].filter(Boolean).join(" ");
  return `<li class="game${g._hidden?" is-hidden":""}" data-key="${esc(g.key)}">
    <span class="rank">${i+1}</span>
    ${g.cover?`<img class="cover" src="${esc(g.cover)}" alt="" loading="lazy" onerror="this.removeAttribute('src')">`:`<img class="cover" alt="">`}
    <button type="button" class="title-btn" aria-expanded="${open}"><p class="t">${esc(g.title)}</p><div class="sub">${subs}</div></button>
    <span class="score ${s.cls}">${s.v??"–"}${s.v!=null?s.unit:""}</span>
    ${open?detail(g):""}
  </li>`;
}
function renderHero(list){
  // The top spot follows what you're looking at: current search, filters and ranking.
  const top = sorted(list)[0];
  const all = DATA.games.filter(g=>!g._hidden);
  const played = all.filter(x=>x._played).length;
  const narrowed = list.length !== all.length;
  if(!top){ $("hero").innerHTML = `<div></div><div><h1>Your game shelf</h1><p class="meta">${all.length} games, ${played} played</p></div>`; return; }
  const sortLabel = (SORTS.find(([k])=>k===state.sort)||[,""])[1].toLowerCase();
  const s = shown(top);
  const big = state.sort==="recent" ? (top.last_played ? new Date(top.last_played+"T12:00").toLocaleDateString([], {month:"short", day:"numeric"}) : null)
            : (s.v!=null ? s.v + (s.unit||"") : null);
  $("hero").innerHTML = `${top.cover?`<img src="${esc(top.cover)}" alt="" onerror="this.removeAttribute('src')">`:`<div></div>`}
    <div><p class="lead">${narrowed ? "Top of this view" : (state.view==="psplus" ? "Top of PS Plus" : CONSOLES[state.view] ? `Top of your ${CONSOLES[state.view].label}` : "Top of your shelf")}, ranked by ${esc(sortLabel)}</p>
    <h1>${esc(top.title)}</h1>
    ${big!=null?`<span class="big ${s.cls}">${esc(big)}</span>`:""}
    <p class="meta">${narrowed ? `${list.length} of ${all.length} games shown` : `${all.length} games, ${played} played`}</p></div>`;
}
function renderActive(){
  const parts = [];
  for(const [f,v] of Object.entries(state.filters)) if(v) parts.push(`<button type="button" class="tagchip" data-clear-filter="${f}">${esc(v)} ✕</button>`);
  if(state.length) parts.push(`<button type="button" class="tagchip" data-clear-length="1">${esc(LENGTHS.find(([v])=>v===state.length)[1])} ✕</button>`);
  state.tags.forEach((t,i)=>parts.push(`<button type="button" class="tagchip" data-clear-tag="${i}">${esc(t.value)} ✕</button>`));
  $("active").innerHTML = parts.join("");
}
function runAct(a, g){
  if(a==="played") togglePlayed(g); if(a==="playing") togglePlaying(g); if(a==="hide") toggleHidden(g); if(a==="fix") openFix(g);
}
function renderNow(){
  if(state.view==="psplus"){ $("now").innerHTML = ""; return; }
  const inView = CONSOLES[state.view] ? new Set(DATA.games.map(g=>g.key)) : null;
  const now = allGames().filter(g=>g._playing && !g._hidden && (!inView || inView.has(g.key))).sort((a,b)=>String(a._playing).localeCompare(String(b._playing)));
  const btn = inView ? `<button type="button" class="iconbtn primary" id="suggestBtn">Suggest what to play next</button>` : "";
  if(!now.length){ $("now").innerHTML = inView ? `<div class="now-head"><p class="now-empty">Nothing pinned to Playing now on this console.</p>${btn}</div>`
                     : `<p class="now-empty">Pin the games you're in the middle of: open a game and tap “Playing now”.</p>`; return; }
  $("now").innerHTML = `<div class="now-head"><h2>Playing now</h2>${btn}</div><div class="now-row">${now.map(g=>{
    const goal = beat(g), done = g.playtime||0;
    const pct = goal && done ? Math.min(100, Math.round(done/goal*100)) : null;
    const line = goal ? (done ? `${hrs(Math.round(done))} of ~${hrs(goal)}` : `~${hrs(goal)} to beat`) : g.platforms.join(", ");
    return `<button type="button" class="now-card" data-key="${esc(g.key)}" aria-label="${esc(g.title)}">
      ${g.cover?`<img src="${esc(g.cover)}" alt="" onerror="this.removeAttribute('src')">`:`<img alt="">`}
      <span class="now-t">${esc(g.title)}</span>
      <span class="now-p">${esc(line)}</span>
      ${pct!=null?`<span class="bar" aria-hidden="true"><i style="width:${pct}%"></i></span>`:""}
    </button>`; }).join("")}</div>`;
}
function openGame(g){
  sheet(`<h2>${esc(g.title)}</h2><div class="game sheet-game" data-key="${esc(g.key)}">${detail(g)}</div>
    <div class="btns"><button value="cancel" class="iconbtn">Close</button></div>`);
  $("sheet").onclick = e=>{ const b=e.target.closest("[data-act]"); if(!b) return;
    const a=b.dataset.act; if(a!=="fix") closeSheet(); runAct(a, g); };
}
function render(){
  savePrefs(); renderActive(); renderNow();
  const list = filtered();
  renderHero(list);
  $("count").textContent = `${list.length} ${list.length===1?"game":"games"}`;
  if(!list.length){ $("out").innerHTML = `<p class="empty">No games match these filters. Clear a filter or the search to see more.</p>`; return; }
  if(!state.group){ $("out").innerHTML = `<ol class="list">${sorted(list).map(gameRow).join("")}</ol>`; return; }
  const field = state.group, by = new Map();
  for(const g of list) for(const v of ((g[field]||[]).length ? g[field] : ["None listed"])){ if(!by.has(v)) by.set(v,[]); by.get(v).push(g); }
  const groups = [...by.entries()].sort((a,b)=>(a[0]==="None listed")-(b[0]==="None listed") || b[1].length-a[1].length || a[0].localeCompare(b[0]));
  $("out").innerHTML = groups.map(([name,gs])=>{
    const all = state.open.has("group:"+name), s = sorted(gs);
    return `<section class="group"><h2>${esc(name)} <small>${gs.length}</small></h2>
      <ol class="list">${(all?s:s.slice(0,5)).map(gameRow).join("")}</ol>
      ${s.length>5?`<button type="button" class="more" data-group="${esc(name)}">${all?"Show top 5":`Show all ${s.length}`}</button>`:""}</section>`;
  }).join("");
}

/* ---------------- What to play next ----------------
   Three picks from the current console tab, among games you haven't played:
   - best average score first;
   - if a pick has an earlier unplayed entry in the same series, that one comes first;
   - a change of pace from what you're playing now: other genres and franchises, and a
     shorter game after a long one (or a longer one after a short one);
   - the three picks also differ from each other. "Suggest others" skips the ones shown. */
const SUGGEST = {skip:new Set()};
const LONG_GAME = 30, SHORT_GAME = 15;  // hours to beat the main story
function seriesOf(g){ return [...(g.series||[]), ...(g.franchises||[])]; }
function earliestUnplayed(g, pool){
  // Same series (IGDB collection), or, when IGDB lists no series, the same main franchise with no
  // spin-off series of its own. The earlier game must share a genre, so crossovers and spin-offs
  // in another genre don't count, and must be well reviewed.
  if(!g.year) return null;
  const genres = new Set(g.genres||[]), ser = g.series||[], fr = (g.franchises||[])[0];
  const same = ser.length ? x=>(x.series||[]).some(n=>ser.includes(n))
                          : x=>!!fr && (x.franchises||[])[0]===fr && !(x.series||[]).length;
  const prev = pool.filter(x=>x!==g && x.year && x.year < g.year && same(x) && (x.genres||[]).some(n=>genres.has(n))
                              && avg(x)!=null && avg(x) >= 70).sort((a,b)=>a.year-b.year);
  return prev.length ? {game:prev[0]} : null;
}
function whereIs(g){
  const p = g.platforms.filter(x=>!["PS4","PS5"].includes(x) || !g._catalog);
  return g._catalog ? `in the PS Plus catalog (${g.platforms.join(", ")})` : g.nso ? `Switch Online (${g.platforms.join(" + ")})` : `you have it on ${p.join(", ")}`;
}
function suggestions(){
  const games = DATA.games.filter(g=>!g._hidden), inTab = new Set(DATA.games.map(g=>g.key));
  const playing = games.filter(g=>g._playing);
  const current = playing.length ? playing : allGames().filter(g=>g._playing && !g._hidden);
  const curGenres = new Set(current.flatMap(g=>g.genres||[]));
  const curSeries = new Set(current.flatMap(seriesOf));
  const curLen = Math.max(0, ...current.map(g=>beat(g)||0));
  const want = curLen >= LONG_GAME ? "short" : (curLen && curLen <= SHORT_GAME ? "long" : "");
  const pool = games.filter(g=>{
    if(g._played || g._playing || !g.matched) return false;
    const h = beat(g);
    if(h && g.playtime && g.playtime >= h*0.9) return false;  // probably finished, just not marked
    return true;
  });
  const usedGenres = new Map(), usedSeries = new Set(), picks = [];
  const rate = g=>{
    const a = avg(g); if(a==null) return null;
    let s = a; const why = [];
    const genres = g.genres||[], ser = seriesOf(g), h = beat(g);
    if(ser.some(n=>curSeries.has(n))) s -= 25;
    const overlap = genres.length ? genres.filter(x=>curGenres.has(x)).length/genres.length : 0;
    s -= 15*overlap;
    if(ser.some(n=>usedSeries.has(n))) s -= 40;
    s -= 8*genres.filter(x=>usedGenres.has(x)).length/Math.max(1,genres.length);
    if(want==="short") s -= h==null ? 4 : (h > 25 ? 12 : h > SHORT_GAME*1.3 ? 5 : 0);
    if(want==="long")  s -= h==null ? 4 : (h < 12 ? 12 : h < 20 ? 5 : 0);
    return s;
  };
  for(let n=0; n<3; n++){
    let best = null, bestS = -1e9;
    for(const g of pool){
      if(SUGGEST.skip.has(g.key) || picks.some(p=>p.game===g)) continue;
      const s = rate(g); if(s!=null && s > bestS){ best = g; bestS = s; }
    }
    if(!best) break;
    let game = best, why = [];
    // Earlier entries are looked up across everything you have: every console, PS Plus and Switch Online.
    const everywhere = allGames().filter(x=>!x._hidden && !x._played && !x._playing && x.matched && !SUGGEST.skip.has(x.key) && !picks.some(p=>p.game===x));
    const prev = earliestUnplayed(best, everywhere);
    if(prev){ game = prev.game; why.push(`Play this game to get to the amazing ${best.title} (${avg(best)}). It's the earliest entry in the series you haven't played.`);
      if(!inTab.has(game.key)) why.push(`Not on this console: ${whereIs(game)}`); }
    else why.push(`Top-rated game you haven't played (average ${avg(game)})`);
    const others = (game.genres||[]).filter(x=>!curGenres.has(x));
    if(current.length && others.length && !(game.genres||[]).some(x=>curGenres.has(x))) why.push(`A change of genre: ${others.slice(0,2).join(", ")}`);
    const h = beat(game);
    if(want==="short" && h && h <= 25) why.push(`Shorter than what you're playing: about ${hrs(h)} to beat`);
    else if(want==="long" && h && h >= 20) why.push(`A longer one this time: about ${hrs(h)} to beat`);
    else if(h) why.push(`About ${hrs(h)} to beat`);
    if(game._catalog && inTab.has(game.key)) why.push("Included with PS Plus");
    picks.push({game, why});
    for(const x of game.genres||[]) usedGenres.set(x, true);
    for(const x of [...seriesOf(game), ...seriesOf(best)]) usedSeries.add(x);
  }
  return {picks, current, want};
}
function openSuggest(reroll){
  if(!reroll) SUGGEST.skip = new Set();
  const {picks, current, want} = suggestions();
  for(const p of picks) SUGGEST.skip.add(p.game.key);
  const basis = current.length ? `Based on ${current.map(g=>esc(g.title)).slice(0,3).join(", ")}${want==="short"?", a long one, so these lean shorter":want==="long"?", a short one, so these lean longer":""}.`
                               : "Nothing is pinned to Playing now, so these are your best-rated unplayed games.";
  sheet(`<h2>Play next on ${esc(CONSOLES[state.view].label)}</h2>
    <p>${basis}</p>
    ${picks.length ? `<div class="picks">${picks.map(({game:g,why})=>{ const a=avg(g); return `<button type="button" class="pick" data-key="${esc(g.key)}">
      ${g.cover?`<img src="${esc(g.cover)}" alt="" onerror="this.removeAttribute('src')">`:`<img alt="">`}
      <span><b>${esc(g.title)}</b><span class="na">${[esc((g.genres||[]).slice(0,2).join(", ")), g.year||""].filter(Boolean).join(" · ")}</span><ul>${why.map(w=>`<li>${esc(w)}</li>`).join("")}</ul></span>
      <span class="score ${tone(a)}">${a??"–"}</span></button>`; }).join("")}</div>`
      : `<p>No more unplayed games with scores on this console.</p>`}
    <div class="btns">
      <button value="cancel" class="iconbtn">Close</button>
      ${picks.length?`<button type="button" class="iconbtn primary" id="reroll">Suggest others</button>`:""}
    </div>`);
  $("sheet").onclick = e=>{
    if(e.target.closest("#reroll")){ openSuggest(true); return; }
    const b = e.target.closest(".pick"); if(!b) return;
    const g = DATA.games.find(x=>x.key===b.dataset.key); if(g) openGame(g);
  };
}

/* ---------------- Sheets ---------------- */
function sheet(html){ $("sheet").innerHTML = html; if(!$("dlg").open) $("dlg").showModal(); }
function closeSheet(){ if($("dlg").open) $("dlg").close(); }
function toast(msg){ const t=$("toast"); t.textContent=msg; t.hidden=false; clearTimeout(t._h); t._h=setTimeout(()=>t.hidden=true, 3800); }

function openSettings(intro){
  const connected = !!token();
  const repo = REPO ? `${REPO.owner}/${REPO.repo}` : "unknown";
  sheet(`<h2>Settings</h2>
    ${intro?`<p>${esc(intro)}</p>`:""}

/* Game suggestions come from Wikidata, which works from the browser without a key and records each
   game's IGDB id, so picking one links the game to the exact IGDB entry. */
async function wikidataGames(q){
  const api = "https://www.wikidata.org/w/api.php?format=json&origin=*&";
  const r1 = await fetch(api + new URLSearchParams({action:"wbsearchentities", search:q, language:"en", uselang:"en", type:"item", limit:"20"}));
  const ids = ((await r1.json()).search||[]).map(x=>x.id);
  if(!ids.length) return [];
  const r2 = await fetch(api + new URLSearchParams({action:"wbgetentities", ids:ids.join("|"), props:"labels|descriptions|claims", languages:"en|mul"}));
  const ents = (await r2.json()).entities || {};
  const out = [];
  for(const id of ids){
    const e = ents[id]; if(!e) continue;
    const slug = e.claims?.P5794?.[0]?.mainsnak?.datavalue?.value;
    if(!slug) continue;  // not a video game with an IGDB entry
    const years = (e.claims?.P577||[]).map(c=>c.mainsnak?.datavalue?.value?.time).filter(Boolean).map(t=>+t.slice(1,5)).filter(Boolean);
    out.push({label:e.labels?.en?.value||e.labels?.mul?.value||slug.replace(/-dot-/g,'.').replace(/-/g,' ').replace(/\b\w/g,c=>c.toUpperCase()), slug, year: years.length?Math.min(...years):null, desc:e.descriptions?.en?.value||e.descriptions?.mul?.value||""});
  }
  return out;
}

      }catch{ if(my===seq) $("addSuggest").innerHTML = ""; }

  $("addSave").onclick = ()=>{
    const title = $("addTitle").value.trim(); if(!title){ toast("Enter a title"); return; }

             if(played) d.played["pending:"+title.toLowerCase()] = today(); },
        `Add game: ${title}`, `Added ${title}. It shows up after the next update (5 to 10 minutes).`, true);
  };
}

/* ---------------- Switch Online classics list ----------------
   Wikipedia often refuses requests from GitHub's servers, but not from your phone or computer.
   About once a day the app reads the Nintendo Classics article here and, when the list changed,
   saves it to config/nso_list.json; the daily update uses it whenever Wikipedia refuses. */
const NSO_APPS = [["Game Boy Advance",["GBA","Switch"]],["Game Boy",["Game Boy","Switch"]],["Super NES",["SNES","Switch"]],
  ["Super Nintendo",["SNES","Switch"]],["SNES",["SNES","Switch"]],["Nintendo Entertainment System",["NES","Switch"]],["NES",["NES","Switch"]],
  ["Nintendo 64",["N64","Switch"]],["N64",["N64","Switch"]],["Genesis",["Genesis","Switch"]],["Mega Drive",["Genesis","Switch"]],
  ["GameCube",["GameCube","Switch 2"]],["Virtual Boy",["Virtual Boy","Switch"]]];
function nsoApp(text){ for(const [n,a] of NSO_APPS) if(new RegExp("\\b"+n.replace(/[.*+?^${}()|[\]\\]/g,"\\$&")+"\\b","i").test(text)) return a; return null; }
function tableGrid(table){
  const grid = [], carry = {};
  for(const tr of table.querySelectorAll("tr")){
    const cells = [...tr.children].filter(c=>c.tagName==="TD"||c.tagName==="TH");
    const row = []; let col = 0, i = 0;
    while(i < cells.length || carry[col]){
      if(carry[col]){ row.push(carry[col].text); if(--carry[col].left <= 0) delete carry[col]; col++; continue; }
      const c = cells[i++]; c.querySelectorAll("sup").forEach(x=>x.remove());
      let text = c.textContent.replace(/\s+/g," ").trim();
      // Availability cells are check/cross icons: read their sort value or the icon's alt text.
      if(!text) text = (c.getAttribute("data-sort-value") || c.querySelector("img")?.getAttribute("alt") || "").trim();
      const span = +c.getAttribute("colspan")||1, rs = +c.getAttribute("rowspan")||1;
      for(let k=0;k<span;k++){ row.push(text); if(rs>1) carry[col] = {text, left:rs-1}; col++; }
    }
    grid.push(row);
  }
  return grid;
}
function parseNsoHtml(html){
  const doc = new DOMParser().parseFromString(html, "text/html");
  const out = []; let current = null;
  for(const el of doc.querySelectorAll("h2,h3,h4,table")){
    if(el.tagName !== "TABLE"){ current = nsoApp(el.textContent) || current; continue; }
    if(!el.classList.contains("wikitable")) continue;
    const cap = el.querySelector("caption"); const app = (cap && nsoApp(cap.textContent)) || current;
    if(!app) continue;
    const grid = tableGrid(el); if(!grid.length) continue;
    const header = grid[0].map(h=>h.toLowerCase());
    const gi = header.findIndex(h=>["game","title","game title"].includes(h));
    const ri = header.findIndex(h=>h.split(/[\/ ,]+/).includes("na") || h.includes("north america") || h==="us" || h==="americas");
    if(gi < 0 || ri < 0) continue;  // no North America column: can't tell Japan-only games apart
    for(const row of grid.slice(1)){
      const title = (row[gi]||"").replace(/\s*\[[^\]]*\]$/,"").replace(/^[*†‡ ]+|[*†‡ ]+$/g,"").trim();
      const avail = (row[ri]||"").trim().toLowerCase();
      if(!title || ["game","title"].includes(title.toLowerCase())) continue;
      if(!avail || avail.startsWith("no") || avail.startsWith("n/a") || ["—","–","-","✗","✘","×"].includes(avail)) continue;
      if(/[\u3040-\u30ff\u4e00-\u9fff]/.test(title)) continue;
      if(/\bSP(\s*\(.*\))?$/.test(title)) continue;  // save-state versions of games already listed
      out.push({title, tag:app[0], console:app[1]});
    }
  }
  const seen = new Set();
  return out.filter(g=>{ const k=g.tag+"|"+g.title.toLowerCase(); if(seen.has(k)) return false; seen.add(k); return true; });
}
async function syncNsoList(){
  if(!REPO || !token()) return;
  const last = store.get("shelf-nso-checked", 0);
  if(Date.now() - last < 20*3600e3) return;
  try{
    const r = await fetch("https://en.wikipedia.org/w/api.php?" + new URLSearchParams({action:"parse", page:"Nintendo_Classics", prop:"text", format:"json", formatversion:"2", redirects:"1", origin:"*"}));
    if(!r.ok) return;
    const games = parseNsoHtml((await r.json()).parse.text);
    if(games.length < 50) return;  // page layout changed; keep the old list
    const cur = await gh("contents/config/nso_list.json");
    let sha = null, old = null;
    if(cur.ok){ const j = await cur.json(); sha = j.sha; try{ old = JSON.parse(b64decode(j.content)).games; }catch{} }
    const key = l => JSON.stringify((l||[]).map(g=>g.tag+"|"+g.title).sort());
    if(key(old) !== key(games)){
      const body = {message:`Update Switch Online classics list (${games.length} games)`,
        content: b64encode(JSON.stringify({fetched:new Date().toISOString(), source:"Wikipedia: Nintendo Classics", games}, null, 1) + "\n")};
      if(sha) body.sha = sha;
      const w = await gh("contents/config/nso_list.json", {method:"PUT", body:JSON.stringify(body), headers:{"Content-Type":"application/json"}});
      if(!w.ok) return;
    }
    store.set("shelf-nso-checked", Date.now());
  }catch{ /* try again next time the app opens */ }
}
async function loadEdits(){
  try{ const r = await readEdits(); if(r){ EDITS = r.data; liveEdits = true; applyAll(); render(); } }
  catch{ /* offline or rate-limited: fall back to the edits baked into data.json */ }
}

/* ---------------- Views: My library / PS Plus ---------------- */
const VIEWS = {library:{file:"data.json"}, psplus:{file:"psplus.json"}};
/* Console tabs: everything you can play on that console, built from your library (and, for PS5, the PS Plus catalog). */
const CONSOLES = {
  ps5:     {label:"PS5", plats:["PS5","PS4","PlayStation"], psplus:true, note:"Your PS4 and PS5 games plus the PS Plus Extra and Premium catalog."},
  switch2: {label:"Switch 2", plats:["Switch","Switch 2"], note:"Your Switch and Switch 2 games plus the Switch Online classics."},
  ds:      {label:"DS", plats:["DS"], note:"Your Nintendo DS games."},
  "3ds":   {label:"3DS", plats:["3DS"], note:"Your Nintendo 3DS games."},
  steam:   {label:"Steam Machine", plats:["Steam"], note:"Your Steam games."},
};
async function loadView(v){
  if(CONSOLES[v]){
    if(!VIEWS[v]){
      const c = CONSOLES[v], lib = await loadView("library"), cat = c.psplus ? await loadView("psplus") : {games:[]};
      const seen = new Set(), games = [];
      for(const g of lib.games) if(g.platforms.some(p=>c.plats.includes(p))){ seen.add(g.key); games.push(g); }
      for(const g of cat.games) if(!seen.has(g.key)){ seen.add(g.key); g._catalog = true; games.push(g); }
      VIEWS[v] = {data:{generated:lib.generated, status:{}, games}};
    }
    return VIEWS[v].data;
  }
  if(!VIEWS[v]) v = "library";
  if(!VIEWS[v].data) VIEWS[v].data = await fetch(VIEWS[v].file,{cache:"no-store"}).then(r=>r.ok?r.json():{games:[]}).catch(()=>({games:[]}));
  return VIEWS[v].data;
}
async function showView(v){
  if(!VIEWS[v] && !CONSOLES[v]) v = "library";
  if(v !== state.view){  // filters that only make sense in one view start fresh
    state.platforms = new Set(); state.filters = {}; state.tags = []; state.open = new Set(); state.q = ""; $("q").value = "";
  }
  state.view = v;
  DATA = await loadView(v);
  document.body.classList.toggle("view-psplus", v==="psplus");
  for(const b of $("tabs").querySelectorAll("[data-view]")) b.setAttribute("aria-selected", b.dataset.view===v);
  $("addBtn").hidden = v==="psplus";
  $("catRow").hidden = v!=="psplus";
  if(v!=="psplus" && state.sort==="added") state.sort = "avg";
  applyAll(); setup(); render();
}
function allGames(){  // Playing now can include catalog games you haven't played on your console yet
  const seen = new Set(), out = [];
  for(const v of ["library","psplus"]) for(const g of (VIEWS[v].data||{}).games||[]) if(!seen.has(g.key)){ seen.add(g.key); out.push(g); }
  return out;
}
$("tabs").onclick = e=>{ const b=e.target.closest("[data-view]"); if(b) showView(b.dataset.view); };
$("tierSeg").onclick = e=>{ const b=e.target.closest("button"); if(!b) return; state.tier=b.dataset.v;
  for(const x of $("tierSeg").querySelectorAll("button")) x.setAttribute("aria-pressed", x===b); render(); };
$("hideOwned").checked = state.hideOwned;
$("hideOwned").onchange = e=>{ state.hideOwned = e.target.checked; render(); };

Promise.all([loadView("library"), loadView("psplus")]).then(()=>showView(state.view)).then(()=>{ loadEdits(); syncNsoList(); });
