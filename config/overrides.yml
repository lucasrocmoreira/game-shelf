# Fixes for the rare game that gets matched or scored wrong. Keys are game titles as they
# appear in your library (case and punctuation don't matter).

# Hide things that aren't really games (demos, betas, apps, tools).
exclude:
  - "Kingdom Hearts: VR Experience"
  - "Spider-Man: Far From Home - Virtual Reality Experience"
  - "Spider-Man: Far From Home VR"
  - "The Matrix Awakens: An Unreal Engine 5 Experience"
  # - Steamworks Common Redistributables
  # - Spacewar

# Force a specific IGDB entry. The slug is the last part of the igdb.com/games/<slug> URL.
igdb:
  # "NieR Replicant ver.1.22474487139...": nier-replicant-ver-dot-1-dot-22474487139
  # Same game on several consoles, kept as one entry:
  "The Legend of Zelda: Twilight Princess": the-legend-of-zelda-twilight-princess
  "Chrono Trigger": chrono-trigger
  "Chrono Trigger (2008)": chrono-trigger
  "Earthworm Jim": earthworm-jim
  "Tomb Raider: Legend": tomb-raider-legend
  "Lord of Darkness": nobunagas-ambition-bushou-fuunroku
  "Fallout 3": fallout-3
  "Valkyria Chronicles": valkyria-chronicles
  "Super Mario Bros.: The Lost Levels": super-mario-bros-the-lost-levels

# Same title, but a different game on a specific console.
igdb_by_platform:
  NES:
    "Tetris": tetris
  Steam:
    "Planet Zoo": planet-zoo
  PS4:
    "Resident Evil 5": resident-evil-5-remastered

# Force a specific Metacritic page. The slug is the last part of metacritic.com/game/<slug>/
metacritic:
  "Chrono Trigger": chrono-trigger
  # "Final Fantasy VII Remake Intergrade": final-fantasy-vii-remake-intergrade

# Change the displayed title.
rename:
  # by library key when two different games share a name
  "igdb:426": "Final Fantasy VI (Final Fantasy III in the US)"
  "igdb:144651": "Dragon Quest III (Super Famicom)"
  # "DOOM": Doom (2016)
